name: Build VPS image (GHCR)

# Costruisce Dockerfile.vps e lo pubblica su GitHub Container Registry, così il VPS
# scarica l'immagine pronta invece di costruirla (servirebbero circa 2 GB di RAM).
# Usa il GITHUB_TOKEN del repository: nessun secret da configurare.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.vps
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/openreply-vps:latest
            ghcr.io/${{ github.repository_owner }}/openreply-vps:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
